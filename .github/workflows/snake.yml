name: Generate Snake Animation

on:
  # Run automatically once every 24 hours (00:00 UTC).
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

  # Refresh the animation whenever main is updated.
  push:
    branches:
      - main

# Never let two runs (e.g. a push and the daily schedule) publish at the same time.
concurrency:
  group: snake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Only permission needed: write access so the SVGs can be pushed to the `output` branch.
    permissions:
      contents: write

    steps:
      # Build the light and dark contribution-snake SVGs into ./dist.
      # `svg-only` is the lighter/faster variant of Platane/snk (no gif toolchain).
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ThatKJ
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Force-push the contents of ./dist to the dedicated `output` branch.
      # The files are then served from:
      #   https://raw.githubusercontent.com/ThatKJ/ThatKJ/output/<file>
      # Nothing is ever committed back to main.
      # crazy-max/ghaction-github-pages v5 needs Actions runner >= 2.327.1,
      # which the GitHub-hosted ubuntu-latest image always satisfies.
      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
