<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kirtan Joshi — @ThatKJ</title>
  <desc id="desc">AI, software, products, systems. A loop of observe, decide, act, verify.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <linearGradient id="loop" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1080" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="8" y="8" width="1184" height="304" rx="16"/></clipPath>
  </defs>

  <rect x="8" y="8" width="1184" height="304" rx="16" fill="#0D1117" stroke="#30363D"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#fadeMask)"/>
    <rect x="8" y="8" width="1184" height="2" fill="url(#edge)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#8B949E">
    <circle cx="70" cy="87" r="4" fill="#3FB950"/>
    <text x="84" y="92">@THATKJ · BANGALORE</text>
  </g>

  <text x="62" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="650" letter-spacing="-2.5" fill="#F0F6FC">Kirtan Joshi</text>

  <text x="66" y="236" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#C9D1D9">AI<tspan fill="#8B5CF6">&#160;·&#160;</tspan>software<tspan fill="#8B5CF6">&#160;·&#160;</tspan>products<tspan fill="#58A6FF">&#160;·&#160;</tspan>systems</text>

  <path id="track" d="M 820 90 H 1040 A 40 40 0 0 1 1080 130 V 190 A 40 40 0 0 1 1040 230 H 820 A 40 40 0 0 1 780 190 V 130 A 40 40 0 0 1 820 90 Z" fill="none" stroke="url(#loop)" stroke-width="1.5" stroke-opacity="0.8"/>

  <g fill="#0D1117" stroke-width="2">
    <circle cx="930" cy="90" r="6" stroke="#8B5CF6"/>
    <circle cx="1080" cy="160" r="6" stroke="#79A8FF"/>
    <circle cx="930" cy="230" r="6" stroke="#58A6FF"/>
  </g>
  <circle cx="780" cy="160" r="13" fill="#3FB950" fill-opacity="0.15"/>
  <circle cx="780" cy="160" r="6" fill="#3FB950"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="1" fill="#8B949E">
    <text x="930" y="70" text-anchor="middle">observe</text>
    <text x="1098" y="165">decide</text>
    <text x="930" y="260" text-anchor="middle">act</text>
    <text x="762" y="165" text-anchor="end" fill="#3FB950">verify</text>
  </g>

  <circle r="3.5" fill="#F0F6FC">
    <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track"/>
    </animateMotion>
  </circle>
</svg>
